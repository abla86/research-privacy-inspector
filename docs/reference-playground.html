<!doctype html><html lang="no"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Reference Inspector Playground</title><style>body{font:16px system-ui;max-width:800px;margin:40px auto;padding:0 18px}input,button{padding:10px;width:100%;box-sizing:border-box;margin:5px 0}pre{background:#f4f4f4;padding:15px;overflow:auto}</style><h1>Reference Inspector Playground</h1><p>Test DOI-normalisering lokalt i nettleseren.</p><input id="doi" value="https://doi.org/10.1000/xyz123"><button id="check">Analyser DOI</button><pre id="out"></pre><script>function normalize(v){return v.trim().replace(/^https?:\/\/(dx\.)?doi\.org\//i,'').replace(/^doi:\s*/i,'').replace(/\s+/g,'')}function valid(v){return /^10\.\d{4,9}\/[-._;()/:a-z0-9]+$/i.test(v)}document.querySelector('#check').onclick=()=>{const raw=document.querySelector('#doi').value,n=normalize(raw);document.querySelector('#out').textContent=JSON.stringify({input:raw,normalized:n,valid:valid(n),localOnly:true},null,2)};document.querySelector('#check').click()</script>
